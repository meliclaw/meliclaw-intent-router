# cargo-deny: bloquea copyleft no permisivo en el artefacto publicado.
# Guía Meliclaw §5 check 4.
#
# OpenMDW-1.1 aplica a pesos NVIDIA Nemotron-3-Embed-1B, no a crates de Rust.
# No añadir OpenMDW a allow/deny: cargo-deny no inspecciona artefactos .onnx.
# Registro: THIRD_PARTY_NOTICES.md.

[graph]
all-features = false
no-default-features = false

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive through tokenizers 0.21.4. No safe upstream replacement is
    # available in this workspace yet; review when tokenizers updates.
    "RUSTSEC-2024-0436",
    # Transitive through indicatif -> tokenizers. No safe upstream replacement
    # is available in this workspace yet; review when tokenizers updates.
    "RUSTSEC-2025-0119",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
